
name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build:
    name: Pull and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check initial disk space
        run: |
          echo "=== Runner ==="
          echo "$RUNNER_NAME"
          echo "$RUNNER_ENVIRONMENT"

          echo "=== Disk ==="
          df -hT
          df -i

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          # 给 Runner 系统和诊断日志预留空间
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 128

          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'

          # 扩容 Docker 数据目录
          build-mount-path: /var/lib/docker

      - name: Restart Docker
        run: |
          sudo systemctl restart docker
          docker info
          echo "=== Disk after setup ==="
          df -hT
          df -i

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun Registry
        shell: bash
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" |
            docker login "$ALIYUN_REGISTRY" \
              --username "$ALIYUN_REGISTRY_USER" \
              --password-stdin

      - name: Pull and Push Images
        shell: bash
        run: |
          set -Eeuo pipefail

          # 确认镜像列表存在
          test -f images.txt

          declare -A first_repo=()
          declare -A duplicate_images=()

          # 第一遍：找出不同仓库下的同名镜像
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue

            read -r -a args <<< "$line"
            source_image="${args[$((${#args[@]} - 1))]}"
            source_repo="${source_image%%@*}"
            source_repo="${source_repo%:*}"

            # 无 tag 的镜像保留完整仓库名称
            if [[ "$source_image" != *"@"* ]]; then
              source_repo="${source_image%:*}"
              if [[ "$source_image" != *:* ]]; then
                source_repo="$source_image"
              fi
            fi

            image_name="${source_repo##*/}"

            if [[ -v first_repo[$image_name] ]]; then
              if [[ "${first_repo[$image_name]}" != "$source_repo" ]]; then
                duplicate_images["$image_name"]=true
              fi
            else
              first_repo["$image_name"]="$source_repo"
            fi
          done < images.txt

          # 即使 push 失败，也清理当前镜像
          current_source=""
          current_target=""

          cleanup_current() {
            if [[ -n "$current_target" ]]; then
              docker image rm "$current_target" || true
            fi

            if [[ -n "$current_source" ]]; then
              docker image rm "$current_source" || true
            fi

            current_source=""
            current_target=""

            docker image prune -af || true
          }

          trap cleanup_current EXIT

          count=0

          # 第二遍：逐个拉取并推送
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue

            read -r -a args <<< "$line"
            platform=""
            source_image=""

            # 支持普通镜像以及 --platform 参数
            if (( ${#args[@]} == 1 )); then
              source_image="${args[0]}"
            elif (( ${#args[@]} == 3 )) &&
                 [[ "${args[0]}" == "--platform" ]]; then
              platform="${args[1]}"
              source_image="${args[2]}"
            elif (( ${#args[@]} == 2 )) &&
                 [[ "${args[0]}" == --platform=* ]]; then
              platform="${args[0]#--platform=}"
              source_image="${args[1]}"
            else
              echo "::error::Unsupported image entry"
              exit 1
            fi

            ((count+=1))

            echo "====================================="
            echo "Processing image #$count"
            echo "Source: $source_image"
            echo "Platform: ${platform:-default}"
            echo "====================================="

            echo "=== Disk before pull ==="
            df -h /
            df -h /var/lib/docker

            # 提取仓库和 tag
            image_without_digest="${source_image%%@*}"
            image_name_tag="${image_without_digest##*/}"

            if [[ "$image_name_tag" == *:* ]]; then
              image_name="${image_name_tag%:*}"
              image_tag="${image_name_tag##*:}"
            else
              image_name="$image_name_tag"
              image_tag="latest"
            fi

            source_repo="${image_without_digest%/*}"
            if [[ "$image_without_digest" != */* ]]; then
              source_repo=""
            fi

            # 避免 digest 镜像都写入 latest
            if [[ "$source_image" == *@sha256:* ]]; then
              digest="${source_image##*@sha256:}"
              image_tag="sha256-${digest:0:12}"
            fi

            platform_prefix=""
            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}_"
            fi

            namespace_prefix=""
            if [[ -v duplicate_images[$image_name] ]] &&
               [[ -n "$source_repo" ]]; then
              namespace_prefix="${source_repo//\//_}_"
              namespace_prefix="${namespace_prefix//:/_}"
              namespace_prefix="${namespace_prefix//./_}"
            fi

            target_image="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${platform_prefix}${namespace_prefix}${image_name}:${image_tag}"

            echo "Target: $target_image"

            current_source="$source_image"
            current_target=""

            # 拉取原始镜像
            if [[ -n "$platform" ]]; then
              docker pull --platform "$platform" "$source_image"
            else
              docker pull "$source_image"
            fi

            # 标记并推送
            docker tag "$source_image" "$target_image"
            current_target="$target_image"

            docker push "$target_image"

            echo "=== Push completed ==="

            # 每推送一个镜像就释放空间
            cleanup_current

            echo "=== Disk after cleanup ==="
            df -h /
            df -h /var/lib/docker

          done < images.txt

          echo "Successfully synced $count images."

      - name: Final disk diagnostics
        if: always()
        run: |
          echo "=== Filesystem ==="
          df -hT
          df -i

          echo "=== Docker ==="
          docker system df || true
